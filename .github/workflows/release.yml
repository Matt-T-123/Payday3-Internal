name: Release
on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g., v1.0.0)'
        required: true
        type: string
      is_wingdk:
        description: 'WinGDK build?'
        required: false
        type: boolean
        default: false
permissions:
  contents: write
jobs:
  build-release:
    runs-on: windows-latest
    steps:
    - name: Checkout Repository with Submodules
      uses: actions/checkout@v4
      with:
        submodules: recursive  # Fetch submodules recursively
        fetch-depth: 0  # Ensures a full clone (needed for some submodules)
    - name: Initialize and Update Submodules (if needed)
      run: |
        git submodule sync --recursive
        git submodule update --init --recursive
    - name: Setup xmake
      uses: xmake-io/github-action-setup-xmake@v1
      with:
        xmake-version: latest
        build-cache: true
    - name: Configure xmake (Release)
      timeout-minutes: 15
      run: |
        xmake update
        xmake global --clean
        xmake config -m release -a x64 -p windows -y
    - name: Build project (Release)
      timeout-minutes: 20
      run: xmake build Payday3-Internal_V2
    - name: Determine WinGDK build
      id: wingdk
      run: |
        $isWinGDK = "${{ github.event.inputs.is_wingdk }}" -eq "true"
        $suffix = if ($isWinGDK) { "-WinGDK" } else { "" }
        echo "IS_WINGDK=$isWinGDK" >> $env:GITHUB_OUTPUT
        echo "SUFFIX=$suffix" >> $env:GITHUB_OUTPUT
      shell: pwsh
    - name: Package Release artifacts (DLL + PDB)
      run: |
        mkdir release-package
        xcopy /E /I Build\Release release-package\
        if ("${{ steps.wingdk.outputs.IS_WINGDK }}" -eq "true") {
          Rename-Item -Path release-package\Payday3-Internal_V2.dll -NewName Payday3-Internal_V2-WinGDK.dll
          if (Test-Path release-package\Payday3-Internal_V2.pdb) {
            Rename-Item -Path release-package\Payday3-Internal_V2.pdb -NewName Payday3-Internal_V2-WinGDK.pdb
          }
        }
        echo "Build completed on $(Get-Date -Format 'yyyy-MM-dd HH:mm:ss')" > release-package\BUILD_INFO.txt
      shell: pwsh
    - name: Create ZIP archive
      run: |
        Compress-Archive -Path release-package\* -DestinationPath Payday3-Internal${{ steps.wingdk.outputs.SUFFIX }}-Release.zip
      shell: pwsh
    - name: Get version
      id: get_version
      run: |
        if ("${{ github.event_name }}" -eq "workflow_dispatch") {
          $version = "${{ github.event.inputs.version }}"
        } else {
          $version = "${{ github.ref_name }}"
        }
        echo "VERSION=$version" >> $env:GITHUB_OUTPUT
      shell: pwsh
    - name: Generate changelog
      id: changelog
      run: |
        $currentVersion = "${{ steps.get_version.outputs.VERSION }}"
        $allTags = git tag --sort=-creatordate
        if ($allTags -contains $currentVersion) {
          $idx = [array]::IndexOf($allTags, $currentVersion)
          $prevTag = if ($idx + 1 -lt $allTags.Length) { $allTags[$idx + 1] } else { $null }
        } else {
          $prevTag = $allTags | Select-Object -First 1
        }
        if ($prevTag) {
          $log = git log "$prevTag..HEAD" --pretty=format:"- %s (%h)"
        } else {
          $log = git log --pretty=format:"- %s (%h)"
        }
        if (-not $log) { $log = "- No changes recorded." }
        $log = $log -join "`n"
        "CHANGELOG<<EOF" >> $env:GITHUB_OUTPUT
        $log >> $env:GITHUB_OUTPUT
        "EOF" >> $env:GITHUB_OUTPUT
      shell: pwsh
    - name: Create Release
      uses: softprops/action-gh-release@v1
      with:
        tag_name: ${{ steps.get_version.outputs.VERSION }}
        name: Release ${{ steps.get_version.outputs.VERSION }}
        draft: false
        prerelease: false
        files: Payday3-Internal${{ steps.wingdk.outputs.SUFFIX }}-Release.zip
        body: |
          ## Payday3-Internal ${{ steps.get_version.outputs.VERSION }}${{ steps.wingdk.outputs.IS_WINGDK == 'true' && ' (MS Store)' || '' }}
          ![GitHub Downloads (all assets, specific tag)](https://img.shields.io/github/downloads/Omega172/Payday3-Internal/${{ steps.get_version.outputs.VERSION }}/total)
          
          ### Packages
          - **Payday3-Internal${{ steps.wingdk.outputs.SUFFIX }}-Release.zip** - Contains DLL + PDB
          
          ### Changes
          ${{ steps.changelog.outputs.CHANGELOG }}
          
          ### Installation
          1. Download `Payday3-Internal${{ steps.wingdk.outputs.SUFFIX }}-Release.zip`
          2. Extract the archive
          3. Follow the instructions in README.md
          
          ### Build Information
          - Build Date: ${{ github.event.head_commit.timestamp }}
          - Commit: ${{ github.sha }}
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}