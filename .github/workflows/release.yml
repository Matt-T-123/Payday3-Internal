name: Release
on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g., v1.0.0)'
        required: true
        type: string
permissions:
  contents: write
jobs:
  build-release:
    runs-on: windows-latest
    steps:
    - name: Checkout Repository with Submodules
      uses: actions/checkout@v4
      with:
        submodules: recursive  # Fetch submodules recursively
        fetch-depth: 0  # Ensures a full clone (needed for some submodules)
    - name: Initialize and Update Submodules (if needed)
      run: |
        git submodule sync --recursive
        git submodule update --init --recursive
    - name: Setup xmake
      uses: xmake-io/github-action-setup-xmake@v1
      with:
        xmake-version: latest
        build-cache: true
    - name: Configure xmake (Release)
      timeout-minutes: 15
      run: |
        xmake update
        xmake global --clean
        xmake config -m release -a x64 -p windows -y
    - name: Build project (Release)
      timeout-minutes: 20
      run: xmake build Payday3-Internal_V2
    - name: Package Release artifacts (DLL + PDB)
      run: |
        mkdir release-package
        xcopy /E /I Build\Release release-package\
        echo "Build completed on $(Get-Date -Format 'yyyy-MM-dd HH:mm:ss')" > release-package\BUILD_INFO.txt
      shell: pwsh
    - name: Create ZIP archive
      run: |
        Compress-Archive -Path release-package\* -DestinationPath Payday3-Internal-Release.zip
      shell: pwsh
    - name: Get version
      id: get_version
      run: |
        if ("${{ github.event_name }}" -eq "workflow_dispatch") {
          $version = "${{ github.event.inputs.version }}"
        } else {
          $version = "${{ github.ref_name }}"
        }
        echo "VERSION=$version" >> $env:GITHUB_OUTPUT
      shell: pwsh
    - name: Create Release
      uses: softprops/action-gh-release@v1
      with:
        tag_name: ${{ steps.get_version.outputs.VERSION }}
        name: Release ${{ steps.get_version.outputs.VERSION }}
        draft: false
        prerelease: false
        files: Payday3-Internal-Release.zip
        body: |
          ## Payday3-Internal ${{ steps.get_version.outputs.VERSION }}
          
          ### Packages
          - **Payday3-Internal-Release.zip** - Contains DLL + PDB
          
          ### Changes
          - Built with xmake in release mode
          - Windows x64 architecture
          
          ### Installation
          1. Download `Payday3-Internal-Release.zip`
          2. Extract the archive
          3. Follow the instructions in README.md
          
          ### Build Information
          - Build Date: ${{ github.event.head_commit.timestamp }}
          - Commit: ${{ github.sha }}
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
